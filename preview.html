<!doctype html>
<!--
  preview.html — the whole demo, one surface.

  There is no separate "frozen demo" and "live demo" any more. There is a library of
  course cards that grows as people search. Cards that already exist open instantly and
  cost nothing; a course nobody has looked up yet shows its retrieved evidence first,
  then offers to compile it — one gated API call, once, ever. After that it's just
  another card in the library.

  That caching model is the point, not a demo shortcut: it's how this scales past a
  curated handful without paying to re-answer the same question.

  Two modes, chosen automatically:
    - live_server.py running  -> full mode: all corpus courses, compile on demand
    - plain http.server       -> library mode: browse every existing card, no compiling
  Library mode exists so the demo cannot fail mid-pitch just because a server is down.

      env -u ANTHROPIC_BASE_URL ANTHROPIC_API_KEY='sk-...' python3 live_server.py
      # or, browse-only:  python3 -m http.server 8000
      then open http://localhost:8000/preview.html
-->

<body>
<div id="root"><div class="boot">Loading…</div></div>

<script type="text/plain" id="app-src">

/* ── data access ────────────────────────────────────────────────────────────
 * Full mode talks to live_server.py. Library mode falls back to reading the two
 * card directories straight off a plain static server, so the demo still opens
 * (browse-only) if nobody started the API.
 */
async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || (res.status + " " + res.statusText));
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

async function listDir(dir) {
  const res = await fetch(dir + "/");
  if (!res.ok) return [];
  const doc = new DOMParser().parseFromString(await res.text(), "text/html");
  return [...doc.querySelectorAll("a[href]")]
    .map((a) => decodeURIComponent(a.getAttribute("href").split("/").pop()))
    .filter((f) => /\.json$/i.test(f) && !f.startsWith("_"))
    .map((f) => f.replace(/\.json$/i, ""));
}

/** Library mode: no API.
 *  Prefers manifest.json (written by build_static.py) because static hosts —
 *  GitHub Pages, Netlify, Vercel — do not serve directory listings, so the
 *  listDir() path silently finds nothing there. Falls back to directory
 *  listing so a plain `python3 -m http.server` still works with no build step. */
async function loadStatic() {
  try {
    const m = await api("manifest.json");
    if (m && m.courses) return { ...m, offline: true };
  } catch (e) { /* no manifest — fall through to directory listing */ }

  const [seed, cached] = await Promise.all([listDir("demo_data"), listDir("card_cache")]);
  const rows = [];
  const add = async (id, origin) => {
    const dir = origin === "seed" ? "demo_data" : "card_cache";
    const j = await (await fetch(`${dir}/${id}.json`)).json();
    rows.push({
      course: id, title: j.title, has_card: true, origin,
      chunks: Object.keys(j.receipts || {}).length,
      receipts: Object.keys(j.receipts || {}).length,
      sources: [...new Set(Object.values(j.receipts || {}).map((r) => r.source).filter(Boolean))].sort(),
      hits: 0, kind: j.kind || "single", member_courses: j.courses || [],
    });
  };
  await Promise.all([...seed.map((id) => add(id, "seed")),
                     ...cached.filter((id) => !seed.includes(id)).map((id) => add(id, "cache"))]);
  rows.sort((a, b) => a.course.localeCompare(b.course));
  return {
    courses: rows, has_key: false, offline: true,
    stats: { cards_total: rows.length, cards_seed: seed.length,
             cards_cached: rows.length - seed.length, cache_hits: 0, api_calls_spent: 0 },
  };
}

/* ── matching ─────────────────────────────────────────────────────────────── */
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

function score(row, q) {
  const nq = norm(q);
  if (!nq) return 0;
  const hay = [row.course, row.title || "", ...(row.member_courses || [])];
  let best = -1;
  for (const h of hay) {
    const at = norm(h).indexOf(nq);
    if (at === -1) continue;
    const s = (at === 0 ? 100 : 50) - Math.min(at, 40);
    if (s > best) best = s;
  }
  // an existing card outranks an equally-good match that would cost a call
  return best < 0 ? best : best + (row.has_card ? 5 : 0);
}

function search(rows, q) {
  if (!q.trim()) return rows;
  return rows.map((r) => ({ r, s: score(r, q) })).filter((x) => x.s >= 0)
    .sort((a, b) => b.s - a.s).map((x) => x.r);
}

/* ── bits ─────────────────────────────────────────────────────────────────── */
function Pill({ row }) {
  if (row.kind === "multi") return <span className="pill pill-multi">compare {row.member_courses.length}</span>;
  if (row.has_card) return <span className="pill pill-ready">ready</span>;
  return <span className="pill pill-new">{row.chunks} chunks</span>;
}

function Tile({ row, onPick }) {
  return (
    <button className="tile" onClick={() => onPick(row)}>
      <div className="tile-top">
        <span className="tile-code">{row.course}</span>
        <Pill row={row} />
      </div>
      {row.title && <div className="tile-title">{row.title}</div>}
      <div className="tile-meta">
        {row.has_card
          ? `${plural(row.receipts ?? row.chunks, "cited source")}${row.hits ? ` · opened ${row.hits}×` : ""}`
          : `${plural(row.chunks, "corpus chunk")} · not compiled yet`}
      </div>
    </button>
  );
}

/* The answer view. Markdown, Cite and Receipts come from CourseCard.jsx, which is
 * compiled in the same Babel pass as this file — so citations behave identically here
 * without exporting anything or duplicating the renderer. */
function AnswerView({ ask, onOpenCard }) {
  const [open, setOpen] = useState(false);
  const [hl, setHl] = useState(null);
  const itemRefs = useRef({});
  const m = ask.match;

  const jump = (id) => {
    setOpen(true); setHl(id);
    requestAnimationFrame(() => {
      const el = itemRefs.current[id];
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  };

  return (
    <div className="answer">
      <div className="answer-card">
        <p className="asked">You asked</p>
        <h2 className="asked-q">{ask.query}</h2>
        <p className="matched">
          Answered from an existing card — <b>{m.card_id}</b>
          {m.title ? ` · ${m.title}` : ""} · <b>{m.tab_label}</b>. No new API call:
          this question was already synthesized and citation-checked.
        </p>
        <Markdown md={m.answer_md} receipts={m.receipts} onJump={jump} />
        <Receipts receipts={m.receipts} ids={m.cited_ids} open={open} setOpen={setOpen}
                  highlighted={hl} itemRefs={itemRefs} />
        <div className="answer-foot">
          <button className="link-btn" onClick={() => onOpenCard(m.card_id)}>
            Open the full {m.card_id} card →
          </button>
          <span className="cp-cost">matched question: “{m.question}”</span>
        </div>
      </div>
    </div>
  );
}

function Search({ rows, stats, offline, q, setQ, onPick, onAnswer, onCompileCourse }) {
  const [open, setOpen] = useState(false);
  const [cur, setCur] = useState(0);
  const [askRes, setAskRes] = useState(null);
  const wrap = useRef(null);

  const hits = useMemo(() => search(rows, q), [rows, q]);
  const answered = !!(askRes && askRes.good_match);
  // Only fall back to "here is every course" when we have nothing at all to offer —
  // showing it under a successful answer reads as a contradiction.
  const empty = q.trim() !== "" && hits.length === 0 && !answered;
  const shown = (empty ? rows : hits).slice(0, 60);

  useEffect(() => { setCur(0); }, [q]);

  // Free-text matching against already-answered questions. Debounced, and free —
  // /api/ask never calls a model. Skipped in browse-only mode (no API at all).
  useEffect(() => {
    if (offline || q.trim().length < 3) { setAskRes(null); return; }
    let alive = true;
    const t = setTimeout(() => {
      api("/api/ask?q=" + encodeURIComponent(q.trim()))
        .then((r) => alive && setAskRes(r))
        // A dead/unreachable server is NOT the same as "no answer exists". Saying
        // "nothing matches" here would be a lie the user can't diagnose.
        .catch(() => alive && setAskRes({ unreachable: true, good_match: false }));
    }, 220);
    return () => { alive = false; clearTimeout(t); };
  }, [q, offline]);
  useEffect(() => {
    const away = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", away);
    return () => document.removeEventListener("mousedown", away);
  }, []);

  const choose = (row) => { setOpen(false); onPick(row); };
  const onKey = (e) => {
    if (e.key === "Escape") { setOpen(false); return; }
    if (!open && (e.key === "ArrowDown" || e.key === "Enter")) { setOpen(true); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); setCur((c) => Math.min(c + 1, shown.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setCur((c) => Math.max(c - 1, 0)); }
    else if (e.key === "Enter" && shown[cur]) { e.preventDefault(); choose(shown[cur]); }
  };

  const saved = stats.cache_hits;
  return (
    <div className="shell">
      <p className="wordmark">Course intel</p>
      <div className="search-wrap" ref={wrap}>
        <div className="search-box">
          <span className="mag" aria-hidden="true">⌕</span>
          <input type="text" value={q} aria-label="Search courses" role="combobox"
                 aria-expanded={open} aria-autocomplete="list"
                 placeholder={offline ? "Search the card library — code or title"
                                       : "Ask a question, or search a course — try “can I take 150 and 213 together?”"}
                 onChange={(e) => { setQ(e.target.value); setOpen(true); }}
                 onFocus={() => setOpen(true)} onKeyDown={onKey} />
          {q && <button className="clear" aria-label="Clear search"
                        onClick={() => { setQ(""); setOpen(true); }}>×</button>}
        </div>
        {open && (
          <div className="suggest">
            {askRes && askRes.unreachable && (
              <div className="ask-head" style={{ color: "#a3321f" }}>
                Can't reach the server — questions need <code>live_server.py</code> running.
                Course browsing below still works.
              </div>
            )}
            {askRes && askRes.good_match && askRes.matches[0] && (
              <>
                <div className="ask-head">Answer — already compiled, no API call</div>
                <button className="ask-row" onMouseDown={(e) => e.preventDefault()}
                        onClick={() => { setOpen(false); onAnswer({ query: q.trim(), match: askRes.matches[0] }); }}>
                  <span className="ask-badge">answer</span>
                  <span className="ask-body">
                    <span className="ask-q">{askRes.matches[0].question}</span>
                    <span className="ask-meta">
                      {askRes.matches[0].card_id}
                      {askRes.matches[0].title ? ` · ${askRes.matches[0].title}` : ""}
                      {" · "}{askRes.matches[0].tab_label}
                    </span>
                  </span>
                </button>
              </>
            )}
            {askRes && !askRes.good_match && askRes.compile_hint && (
              <>
                <div className="ask-head">No answer for that course yet</div>
                <button className="ask-row" onMouseDown={(e) => e.preventDefault()}
                        onClick={() => { setOpen(false); onCompileCourse(askRes.compile_hint); }}>
                  <span className="ask-badge" style={{ background: "#f1ebe2", color: "#8a8177" }}>
                    compile
                  </span>
                  <span className="ask-body">
                    <span className="ask-q">Build a card for {askRes.compile_hint}</span>
                    <span className="ask-meta">
                      Nothing in the library covers it — this would be a new API call.
                    </span>
                  </span>
                </button>
              </>
            )}
            {empty && (
              <div className="suggest-note">
                Nothing matches <b>“{q.trim()}”</b>. Everything available:
              </div>
            )}
            <ul role="listbox">
              {shown.map((row, i) => (
                <li key={row.course}>
                  <button className={"sg" + (!empty && i === cur ? " cursor" : "")}
                          role="option" aria-selected={!empty && i === cur}
                          onMouseDown={(e) => e.preventDefault()} onClick={() => choose(row)}>
                    <span className="sg-code">{row.course}</span>
                    <span className="sg-title">{row.title || "—"}</span>
                    <Pill row={row} />
                  </button>
                </li>
              ))}
            </ul>
          </div>
        )}
      </div>
      <p className="scale-line">
        <b>{stats.cards_total} course cards ready</b>
        {!offline && <> · {rows.length} courses searchable</>}
        {offline && stats.corpus_courses > 0 && <> · {stats.corpus_courses} courses in the corpus</>}
        {saved > 0 && <span className="saved"> · {saved} opened from cache, {plural(saved, "API call")} avoided</span>}
      </p>
    </div>
  );
}

function Library({ rows, onPick }) {
  const [showAll, setShowAll] = useState(false);
  const ready = rows.filter((r) => r.has_card);
  const rest = rows.filter((r) => !r.has_card);
  const restShown = showAll ? rest : rest.slice(0, 12);

  return (
    <>
      <div className="section">
        <h2 className="section-title">Previously searched</h2>
        <p className="section-sub">
          Already compiled and cited — these open instantly and cost nothing.
        </p>
        <div className="grid">
          {ready.map((r) => <Tile key={r.course} row={r} onPick={onPick} />)}
        </div>
      </div>

      {rest.length > 0 && (
        <div className="section" style={{ paddingBottom: "3rem" }}>
          <h2 className="section-title">Not searched yet</h2>
          <p className="section-sub">
            In the corpus but never compiled. Opening one shows its evidence first, then
            offers to build the card — one API call, once; after that it joins the list above.
          </p>
          <div className="grid">
            {restShown.map((r) => <Tile key={r.course} row={r} onPick={onPick} />)}
          </div>
          {rest.length > restShown.length && (
            <p className="more-line">
              <button onClick={() => setShowAll(true)}>
                show all {rest.length} uncompiled courses
              </button>
            </p>
          )}
        </div>
      )}
    </>
  );
}

function CompilePanel({ row, hasKey, offline, onCompiled }) {
  const [preview, setPreview] = useState(null);
  const [previewErr, setPreviewErr] = useState(null);
  const [full, setFull] = useState(false);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState(null);

  useEffect(() => {
    setPreview(null); setPreviewErr(null); setStatus(null);
    if (offline) return;
    api("/api/preview?course=" + encodeURIComponent(row.course))
      .then(setPreview).catch((e) => setPreviewErr(e.message));
  }, [row.course, offline]);

  const thin = preview && preview.hits.length > 0 &&
               new Set(preview.hits.map((h) => h.source)).size < 2;
  const canCompile = hasKey && !offline && preview && preview.hits.length > 0 && !busy;

  const compile = () => {
    setBusy(true); setStatus(null);
    api("/api/compile", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ course: row.course, full }) })
      .then((card) => { setBusy(false); onCompiled(card); })
      .catch((e) => {
        setBusy(false);
        const extra = e.data && e.data.invented ? " Invented ids: " + e.data.invented.join(", ") : "";
        setStatus({ msg: e.message + extra });
      });
  };

  return (
    <div className="cp">
      <div className="cp-card">
        <div className="cp-head">
          <span className="cp-code">{row.course}</span>
          {row.title && <span className="cp-title">{row.title}</span>}
        </div>
        <p className="cp-sub">
          No card yet. This is the evidence retrieval found — real passages from the
          corpus, no model call made.
        </p>

        {offline && <p className="cp-warn">This public demo is browse-only. Compiling a new
          course runs a real API call, so it happens locally, not from this page.</p>}
        {previewErr && <p className="cp-warn">Retrieval failed: {previewErr}</p>}
        {preview && preview.hits.length === 0 && (
          <p className="cp-warn">Nothing retrieved for {row.course} — there's no evidence
            to cite, so compiling is disabled.</p>
        )}
        {preview && preview.hits.length > 0 && (
          <ul className="cp-hits">
            {preview.hits.map((h) => (
              <li className="cp-hit" key={h.pid}>
                <span className="src">{h.source}</span>
                <span className="snip">{h.snippet}</span>
              </li>
            ))}
          </ul>
        )}
        {thin && (
          <p className="cp-warn">Heads up: every passage here comes from one source.
            The card will be a summary, not a cross-source synthesis.</p>
        )}
        {!hasKey && !offline && (
          <p className="cp-warn">ANTHROPIC_API_KEY isn't set on the server, so compiling
            is disabled.</p>
        )}

        <div className="cp-actions">
          <button className="btn" disabled={!canCompile} onClick={compile}>
            {busy ? "Compiling…" : full ? "Compile full card (5 calls)" : "Compile card (1 call)"}
          </button>
          <label className="cp-full">
            <input type="checkbox" checked={full} disabled={busy}
                   onChange={(e) => setFull(e.target.checked)} />
            all 4 facets too
          </label>
          <span className="cp-cost">real API call · ~15–60s · then cached forever</span>
        </div>
        {status && <p className="cp-status err">{status.msg}</p>}
      </div>
    </div>
  );
}

function App() {
  const [idx, setIdx] = useState(null);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const [card, setCard] = useState(null);      // the loaded card for `sel`
  const [loading, setLoading] = useState(false);
  const [answer, setAnswer] = useState(null);  // a free-text question resolved from cache

  const refresh = () =>
    api("/api/courses").catch(() => loadStatic()).then(setIdx).catch((e) => setErr(e.message));

  useEffect(() => { refresh(); }, []);

  if (err) return <div className="boot">Could not load: {err}</div>;
  if (!idx) return <div className="boot">Loading course library…</div>;

  const offline = !!idx.offline;

  const pick = (row) => {
    setQ(""); setAnswer(null); setSel(row); setCard(null); window.scrollTo({ top: 0 });
    if (!row.has_card) return;
    setLoading(true);
    const load = offline
      ? fetch(`${row.origin === "seed" ? "demo_data" : "card_cache"}/${row.course}.json`)
          .then((r) => r.json())
      : api("/api/card?course=" + encodeURIComponent(row.course));
    load.then((c) => { setCard(c); setLoading(false); })
        .catch((e) => { setErr(e.message); setLoading(false); });
  };

  const afterCompile = (c) => { setCard(c); refresh(); };

  const showAnswer = (a) => { setQ(""); setSel(null); setCard(null); setAnswer(a);
                              window.scrollTo({ top: 0 }); };
  const byId = (id) => idx.courses.find((r) => r.course === id);
  const openCardById = (id) => { const r = byId(id); if (r) pick(r); };
  const compileCourse = (id) => {
    const r = byId(id);
    if (r) pick(r);   // lands on the compile panel, since it has no card yet
  };

  let body;
  if (answer) body = <AnswerView ask={answer} onOpenCard={openCardById} />;
  else if (!sel) body = <Library rows={idx.courses} onPick={pick} />;
  else if (loading) body = <div className="boot">Opening card…</div>;
  else if (card) body = <CourseCard card={card} />;
  else body = <CompilePanel row={sel} hasKey={idx.has_key} offline={offline}
                             onCompiled={afterCompile} />;

  return (
    <>
      <Search rows={idx.courses} stats={idx.stats} offline={offline}
              q={q} setQ={setQ} onPick={pick} onAnswer={showAnswer}
              onCompileCourse={compileCourse} />
      {answer && (
        <div className="crumb">
          <button onClick={() => setAnswer(null)}>← All courses</button>
        </div>
      )}
      {sel && (
        <>
          <div className="crumb">
            <button onClick={() => { setSel(null); setCard(null); }}>← All courses</button>
          </div>
          {card && card._origin === "cache" && (
            <p className="origin-note">
              Compiled on demand{card._hits > 1 ? ` · opened ${card._hits}×, no new API call` : ""}
            </p>
          )}
        </>
      )}
      {body}
    </>
  );
}
</script>

<script>
Promise.all([
  fetch("CourseCard.jsx").then(r => r.text()),
  Promise.resolve(document.getElementById("app-src").textContent),
])
  .then(([src, appSrc]) => {
    const stripped = src
      .replace(/^\s*import\s+React[^\n]*\n/m, "")
      .replace(/^\s*import\s+["'][^"']+\.css["'];?\s*\n/m, "")
      .replace(/^\s*export default function CourseCard/m, "function CourseCard");
    const { useState, useEffect, useMemo, useRef } = React;
    const code = Babel.transform(stripped + "\n" + appSrc, { presets: ["react"] }).code;
    const App = new Function(
      "React", "useState", "useEffect", "useMemo", "useRef",
      code + "\nreturn App;"
    )(React, useState, useEffect, useMemo, useRef);
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  })
  .catch(e => {
    document.getElementById("root").innerHTML =
      '<div class="boot">Failed to boot: ' + e.message + '</div>';
  });
</script>
</body>
</html>
